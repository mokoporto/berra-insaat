<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı | Berra Proje ve İnşaat</title>
  <meta name="description" content="Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Berra Proje ve İnşaat ana sayfasına dönebilirsiniz.">
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 480px; }
    .code { font-size: 72px; font-weight: 700; color: #d97706; letter-spacing: 2px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #d97706;
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { background: #b45309; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Sayfa Bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Ana sayfadan devam edebilirsiniz.</p>
    <a href="/">Ana Sayfaya Dön</a>
  </main>
</body>
</html>
